name: Build and tag download-fix plugin

on:
  workflow_dispatch:
  push:
    branches:
      - fix/file-download-2.1.1
    paths:
      - .github/workflows/bundle-downloadfix.yml
      - plugin.xml
      - package.json
      - src/android/build.gradle
      - src/ios/**
      - CHANGELOG.md

permissions:
  contents: write

concurrency:
  group: downloadfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-android-aar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Cordova plugin
        uses: actions/checkout@v4
      - name: Check out patched Android library
        uses: actions/checkout@v4
        with:
          repository: cyruscvc/OSInAppBrowserLib-Android
          ref: fix/file-download-2.0.3
          path: .native-android
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - name: Build patched release AAR
        working-directory: .native-android
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease
      - name: Copy and commit patched AAR
        run: |
          mkdir -p src/android/libs
          cp .native-android/build/outputs/aar/OSInAppBrowserLib-release.aar \
            src/android/libs/ioninappbrowser-android-2.0.3-downloadfix.1.aar
          test -s src/android/libs/ioninappbrowser-android-2.0.3-downloadfix.1.aar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/android/libs/ioninappbrowser-android-2.0.3-downloadfix.1.aar
          if ! git diff --cached --quiet; then
            git commit -m "build(android): bundle download-fix AAR"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  validate-ios:
    needs: bundle-android-aar
    runs-on: macos-latest
    steps:
      - name: Check out branch including generated AAR
        uses: actions/checkout@v4
        with:
          ref: fix/file-download-2.1.1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Cordova
        run: npm install --global cordova@12
      - name: Create test app and install plugin
        run: |
          cordova create /tmp/iab-download-test com.example.iabdownload IABDownload
          cd /tmp/iab-download-test
          cordova platform add ios@7.1.1
          cordova plugin add "${GITHUB_WORKSPACE}"
      - name: Compile iOS simulator app
        run: |
          cd /tmp/iab-download-test
          xcodebuild \
            -workspace platforms/ios/IABDownload.xcworkspace \
            -scheme IABDownload \
            -sdk iphonesimulator \
            -configuration Debug \
            SWIFT_VERSION=5.0 \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            build

  tag:
    needs:
      - bundle-android-aar
      - validate-ios
    runs-on: ubuntu-latest
    steps:
      - name: Check out completed branch
        uses: actions/checkout@v4
        with:
          ref: fix/file-download-2.1.1
          fetch-depth: 0
      - name: Create stable tag
        run: |
          git pull --ff-only origin fix/file-download-2.1.1
          if ! git ls-remote --exit-code --tags origin refs/tags/2.1.1-downloadfix.1; then
            git tag 2.1.1-downloadfix.1
            git push origin refs/tags/2.1.1-downloadfix.1
          fi
