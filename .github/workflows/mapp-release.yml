name: Validate and tag consolidated M App plugin

on:
  workflow_dispatch:
  push:
    branches: [release/mapp-2.1.1]

permissions:
  contents: read

concurrency:
  group: mapp-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cyruscvc/OSInAppBrowserLib-Android
          ref: 714129011462a09c40354117aaa7b71148d48787
          path: .native-android
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDKs
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test bridge and build native library
        working-directory: .native-android
        run: |
          node --test tests/download-bridge.test.cjs
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease
      - name: Bundle exact AAR
        run: |
          mkdir -p src/android/libs
          cp .native-android/build/outputs/aar/OSInAppBrowserLib-release.aar src/android/libs/ioninappbrowser-android-2.0.3-mapp.1.aar
          sha256sum src/android/libs/ioninappbrowser-android-2.0.3-mapp.1.aar
      - name: Clean Android Cordova installation and build
        run: |
          npm install --global cordova@12
          cordova create /tmp/mapp-android com.example.mappbrowser MAppBrowser
          cd /tmp/mapp-android
          node -e 'const fs=require("fs");const p="config.xml";fs.writeFileSync(p,fs.readFileSync(p,"utf8").replace("</widget>","<preference name=\"android-minSdkVersion\" value=\"26\"/><preference name=\"GradlePluginKotlinVersion\" value=\"1.9.25\"/></widget>"));'
          cordova platform add android@14.0.1
          cordova plugin add "$GITHUB_WORKSPACE"
          cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: verified-android-aar
          path: src/android/libs/ioninappbrowser-android-2.0.3-mapp.1.aar
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean iOS Cordova installation
        run: |
          npm install --global cordova@12
          cordova create /tmp/mapp-ios com.example.mappbrowser MAppBrowser
          cd /tmp/mapp-ios
          cordova platform add ios@7.1.1
          cordova plugin add "$GITHUB_WORKSPACE"
          /usr/libexec/PlistBuddy -c 'Print :LSApplicationQueriesSchemes' platforms/ios/MAppBrowser/MAppBrowser-Info.plist
      - name: Compile iOS simulator app
        run: |
          cd /tmp/mapp-ios
          xcodebuild -workspace platforms/ios/MAppBrowser.xcworkspace -scheme MAppBrowser \
            -sdk iphonesimulator -configuration Debug SWIFT_VERSION=5.0 \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 CODE_SIGNING_ALLOWED=NO build

  package:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Verify branch has not moved
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/download-artifact@v4
        with:
          name: verified-android-aar
          path: src/android/libs
      - name: Validate all packaged source paths and metadata
        run: python3 tests/validate-package.py
      - name: Commit binary and create immutable release reference
        run: |
          test -s src/android/libs/ioninappbrowser-android-2.0.3-mapp.1.aar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/android/libs/ioninappbrowser-android-2.0.3-mapp.1.aar
          git commit -m 'build: bundle validated M App Android AAR'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags origin refs/tags/2.1.1-mapp.1; then
            echo 'Tag already exists; refusing to replace it.'
            exit 1
          fi
          git tag 2.1.1-mapp.1
          git push origin refs/tags/2.1.1-mapp.1
